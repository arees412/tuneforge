[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tuneforge"
version = "0.1.0"
description = "Governed LLM and VLM fine-tuning platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Arees Shah" }]
dependencies = [
  "accelerate>=1.3,<2",
  "fastapi>=0.115,<1",
  "peft>=0.18,<1",
  "pydantic>=2.10,<3",
  "safetensors>=0.4.3,<1",
  "torch>=2.4,<3",
  "transformers>=4.55,<6",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
trl = ["trl>=0.18,<1"]
qlora = ["bitsandbytes>=0.45"]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-psutil>=6.1,<7",
]

[project.scripts]
tuneforge = "tuneforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tuneforge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "training: real tiny-model training tests",
]

[tool.coverage.run]
source = ["tuneforge"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

