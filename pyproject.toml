[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tuneforge"
version = "0.1.0"
description = "Governed LLM and VLM fine-tuning platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Arees Shah" }]

[tool.hatch.build.targets.wheel]
packages = ["src/tuneforge"]

